[project]
name = "storywrangler-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "storywrangler-schemas",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "duckdb>=1.2.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.uv.sources]
storywrangler-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
