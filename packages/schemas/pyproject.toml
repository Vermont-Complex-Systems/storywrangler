[project]
name = "storywrangler-schemas"
version = "1.0.0"
description = "Shared Pydantic schemas for the Storywrangler platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "mmh3>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storywrangler_schemas"]
