[project]
name = "storywrangler-schemas"
version = "0.3.1"
description = "Shared Pydantic schemas for the Storywrangler platform"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vermont Complex Systems Institute", email = "compstorylab@uvm.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0.0",
    "mmh3>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/vermont-complex-systems/storywrangler"
Documentation = "https://complexstories.uvm.edu"
Repository = "https://github.com/vermont-complex-systems/storywrangler/tree/main/packages/schemas"
Specification = "https://github.com/vermont-complex-systems/Storywrangler-Specification"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storywrangler_schemas"]
