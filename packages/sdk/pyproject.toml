[project]
name = "storywrangler"
version = "0.0.21"
description = "Dataset registration client, entity validation, and project scaffolding for Storywrangler"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vermont Complex Systems Institute", email = "compstorylab@uvm.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "storywrangler-schemas>=0.3.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[dependency-groups]
dev = ["pandas>=2.0", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/vermont-complex-systems/storywrangler"
Documentation = "https://complexstories.uvm.edu"
Repository = "https://github.com/vermont-complex-systems/storywrangler/tree/main/packages/sdk"
Specification = "https://github.com/vermont-complex-systems/Storywrangler-Specification"

[tool.uv.sources]
storywrangler-schemas = { workspace = true }

[project.scripts]
storywrangler = "storywrangler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storywrangler"]
