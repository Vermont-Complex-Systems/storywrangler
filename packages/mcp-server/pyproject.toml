[project]
name = "storywrangler-mcp"
version = "0.1.0"
description = "MCP server exposing Storywrangler documentation and the dataset registry to AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Vermont Complex Systems Institute", email = "compstorylab@uvm.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "storywrangler-schemas>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/vermont-complex-systems/storywrangler"
Documentation = "https://complexstories.uvm.edu"
Repository = "https://github.com/vermont-complex-systems/storywrangler/tree/main/packages/mcp-server"

[tool.uv.sources]
storywrangler-schemas = { workspace = true }

[project.scripts]
storywrangler-mcp = "storywrangler_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storywrangler_mcp"]
