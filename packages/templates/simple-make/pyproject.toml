[project]
name = "my-dataset"
version = "0.1.0"
description = "Dataset adapter for Storywrangler"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pyprojroot>=0.3.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "storywrangler-sdk",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.uv.sources]
storywrangler-sdk = { path = "../sdk", editable = true }
