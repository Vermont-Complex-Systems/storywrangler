[project]
name = "storywrangler-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "storywrangler-sdk",
    "storywrangler-text",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0"
]

[tool.uv.sources]
storywrangler-sdk = { workspace = true }
storywrangler-text = { workspace = true }

# Simplified build - just point to app/
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]