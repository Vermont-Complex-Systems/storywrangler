[project]
name = "storywrangler-text"
version = "1.0.0"
description = "Text processing for Storywrangler"
requires-python = ">=3.11"
dependencies = [
    "storywrangler-sdk",
    "spacy>=3.7.0",
    "pandas>=2.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storywrangler"]

[tool.uv.sources]
storywrangler-sdk = { workspace = true }